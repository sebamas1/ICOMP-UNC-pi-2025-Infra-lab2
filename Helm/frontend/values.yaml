# Por entorno: ../dev/frontend.yaml y ../prd/frontend.yaml
# Paths: /api antes que / (mismo Ingress, sin rewrite: el backend recibe /api/...).
replicaCount: 1

image:
  repository: public.ecr.aws/b4c0c6w7/tesis/tp1-frontend
  tag: dev
  pullPolicy: Always

containerPort: 3000

env:
  # Runtime: el entrypoint del contenedor reemplaza __API_BASE_URL__ en config.js.
  # "" = mismo origen (Ingress app.local: el navegador pide /api/... al mismo host).
  # Omitir en docker run local para default http://localhost:8080.
  VITE_API_BASE_URL: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: app.local
      paths:
        - path: /api
          pathType: Prefix
          service:
            name: tp1-backend-service
            port: 8080
        - path: /
          pathType: Prefix
  tls: []

resources: {}
